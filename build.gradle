// Repository coordinator only; no Minecraft mod or repository runtime is produced here.
plugins { id 'base'; id 'idea' }

def products = file('mods').listFiles().findAll { new File(it, 'verification.json').isFile() }.sort()
ext.modProducts = products.collect { it.name }
apply from: 'build-logic/prune-builds.gradle'
def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def python = providers.environmentVariable('PYTHON').orElse(windows ? 'python' : 'python3')
def warningMode = gradle.startParameter.warningMode.toString().toLowerCase(Locale.ROOT)
def nativeWarningOptions = warningMode in ['all', 'fail'] ? ['--warning-mode', warningMode] : []
def launcher = { String name, String description, List<String> arguments ->
    tasks.register(name, Exec) {
        group = 'multiversion'
        it.description = description
        workingDir rootDir
        commandLine([python.get(), file('scripts/build.py').absolutePath] + arguments + nativeWarningOptions)
    }
}
products.each { product ->
    def title = product.name.split('-').collect { it.capitalize() }.join('')
    def commonId = title.uncapitalize() + 'Common'
    def verification = new groovy.json.JsonSlurper().parse(new File(product, 'verification.json'))
    launcher("build${title}", "Build every implemented ${title} target", ['all', '--mod', product.name, '--skip-common-tests']).configure { dependsOn ":${commonId}:test" }
    launcher("test${title}", "Test every implemented ${title} target", ['test', '--mod', product.name, '--skip-common-tests']).configure { dependsOn ":${commonId}:test" }
    verification.targets.keySet().each { target ->
        def suffix = target.replace('.', '_')
        launcher("build${title}${suffix}", "Build ${title} for Minecraft ${target}", ['build', target, '--mod', product.name])
        ['Client': 'client', 'Server': 'server'].each { side, action ->
            launcher("run${title}${side}${suffix}", "Run ${title} Minecraft ${target} ${action}", [action, target, '--mod', product.name]).configure {
                doFirst {
                    if (providers.gradleProperty('targetDryRun').orElse('false').get().toBoolean()) args '--dry-run'
                }
            }
        }
    }
}
launcher('buildAll', 'Build all products and implemented targets', ['all', '--skip-common-tests']).configure {
    dependsOn products.collect { ':' + it.name.split('-').collect { part -> part.capitalize() }.join('').uncapitalize() + 'Common:test' }
}
launcher('testAll', 'Run every product common and native target test task', ['test', '--skip-common-tests']).configure {
    dependsOn products.collect { ':' + it.name.split('-').collect { part -> part.capitalize() }.join('').uncapitalize() + 'Common:test' }
}
launcher('cleanAll', 'Clean active product outputs while retaining caches, worlds and templates', ['clean']).configure {
    dependsOn 'clean', products.collect { ':' + it.name.split('-').collect { part -> part.capitalize() }.join('').uncapitalize() + 'Common:clean' }
}
idea.module { excludeDirs += [file('reference'), file('build-logic/target-templates')] }
